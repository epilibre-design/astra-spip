[(#REM)

	Formulaire de recherche au format d'Astra (searchform.php)

	[(#ENV{action}|form_hidden)]
	[<input type="hidden" name="lang" value="(#ENV{lang})" />]
	<label for="#ENV{_id_champ}">
		<span class="screen-reader-text"><:astra:rechercher_libelle:></span>
		<input type="search" id="#ENV{_id_champ}" class="search-field" placeholder="<:astra:rechercher_placeholder|attribut_html:>"[ value="(#ENV{recherche})"] name="recherche" accesskey="4" autocapitalize="off" autocorrect="off" />

		</button>
	</label>
	<input type="submit" class="search-submit" value="<:astra:rechercher|attribut_html:>" />
</form>
