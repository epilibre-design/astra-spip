[(#REM)

	Auteur : archive d'auteur d'Astra

]<BOUCLE_auteur_principal(AUTEURS){id_auteur}>
<!DOCTYPE html>
<html dir="#LANG_DIR" lang="#LANG" class="[(#LANG_DIR)][ (#LANG)] no-js">
<head>
<title>[(#NOM|textebrut)] – [(#NOM_SITE_SPIP|textebrut)]</title>
[<meta name="description" content="(#BIO|couper{150}|attribut_html)" />]
<INCLURE{fond=inclure/head}{contexte=auteur}{id=#ID_AUTEUR} />
</head>
<body itemtype="https://schema.org/ProfilePage" itemscope="itemscope" class="[(#VAL{auteur}|astra_body_class{#ID_AUTEUR})]">
<INCLURE{fond=inclure/body-debut} />
<INCLURE{fond=inclure/header}{type_page=auteur} />
<div id="content" class="site-content">
	<div class="ast-container">
		<INCLURE{fond=inclure/sidebar}{type_page=auteur}{position=left-sidebar} />
		<div id="primary" class="content-area primary ast-grid-3 ast-blog-layout-4-grid">
			<section class="ast-archive-description">
				<h1 class="page-title ast-archive-title">[(#LOGO_AUTEUR|image_passe_partout{80,80}|image_recadre{80:80}|inserer_attribut{class,avatar avatar-80 photo})] #NOM</h1>
				
				[<div class="ast-archive-texte">(#BIO)</div>]
			</section>
			<main id="main" class="site-main">
				<B_articles>
				<div class="ast-row">
					<BOUCLE_articles(ARTICLES){id_auteur}{par date}{inverse}{pagination #VAL{articles_par_page}|astra_conf|astra_largeur{1}}>
					<INCLURE{fond=inclure/article-resume}{id_article} />
					</BOUCLE_articles>
				</div>
			</main><!-- #main -->
			[(#PAGINATION{astra})]
				</B_articles>
				<INCLURE{fond=inclure/aucun-resultat} />
			</main><!-- #main -->
				<//B_articles>
		</div><!-- #primary -->
		<INCLURE{fond=inclure/sidebar}{type_page=auteur}{position=right-sidebar} />
	</div> <!-- ast-container -->
</div><!-- #content -->
<INCLURE{fond=inclure/footer}{type_page=auteur} />
</body>
</html>
</BOUCLE_auteur_principal>
