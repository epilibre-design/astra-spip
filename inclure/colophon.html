[(#REM)

	Pied de page du site (footer builder d’Astra) : élément footer#colophon, sans fermer #page.

	Paramètres : id_rubrique, id_secteur, id_article, type_page (état actif des menus)

]<footer class="site-footer" id="colophon" itemtype="https://schema.org/WPFooter" itemscope="itemscope" itemid="#colophon">
	<BOUCLE_rangees_pied(DATA){source table, #VAL{pied}|astra_hfb_rangees}>
	<div class="[(#VALEUR{classes})]" data-section="section-[(#VALEUR{rangee})]-footer-builder">
		<div class="ast-builder-grid-row-container-inner">
			<div class="ast-builder-footer-grid-columns site-[(#VALEUR{rangee})]-footer-inner-wrap ast-builder-grid-row">
				<BOUCLE_colonnes(DATA){source table, #VALEUR{colonnes}}>
				<div class="site-footer-[(#_rangees_pied:VALEUR{rangee})]-section-[(#CLE)] site-footer-section site-footer-section-[(#CLE)]">
					<BOUCLE_elements_pied(DATA){source table, #VALEUR}><INCLURE{fond=#VALEUR{fond}}{id=#VALEUR{id}}{numero=#VALEUR{numero}}{groupe=#VALEUR{groupe}}{appareil=ordinateur}{id_rubrique}{id_secteur}{id_article}{type_page} /></BOUCLE_elements_pied>
				</div>
				</BOUCLE_colonnes>
			</div>
		</div>
	</div>
	</BOUCLE_rangees_pied>
</footer><!-- #colophon -->
