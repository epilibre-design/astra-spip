[(#REM)

	Barre latérale (#secondary) : produite uniquement si la disposition
	du type de page correspond à la position demandée.

	Paramètres :
	- type_page : sommaire, rubrique, article…
	- position : left-sidebar | right-sidebar
	- id_rubrique : rubrique courante (sous-rubriques affichées)

]<BOUCLE_si_barre(CONDITION){si #ENV{type_page}|astra_barre_a{#ENV{position}}}>
<div class="widget-area secondary" id="secondary" itemtype="https://schema.org/WPSideBar" itemscope="itemscope">
	<div class="sidebar-main">
		<INCLURE{fond=inclure/widgets/recherche}{balise=aside} />
		<INCLURE{fond=inclure/widgets/sous_rubriques}{balise=aside}{id_rubrique} />
		<INCLURE{fond=inclure/widgets/articles_recents}{balise=aside} />
		<INCLURE{fond=inclure/widgets/forums_recents}{balise=aside} />
		<INCLURE{fond=inclure/widgets/mots_cles}{balise=aside} />
	</div>
</div><!-- #secondary -->
</BOUCLE_si_barre>
