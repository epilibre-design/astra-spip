]<B_articles_recents>

	<nav aria-label="<:astra:articles_recents|attribut_html:>">

		<BOUCLE_articles_recents(ARTICLES){par date}{inverse}{0,5}>

		</BOUCLE_articles_recents>
	</ul>
	</nav>
</[(#ENV{balise,aside})]>
</B_articles_recents>
