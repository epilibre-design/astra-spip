[(#REM)

	Élément « search » : icône de recherche dépliant un champ (slide-search d'Astra).
	Le formulaire envoie vers la page de recherche de SPIP.

]<div class="ast-builder-layout-element ast-flex site-header-focus-item ast-header-search" data-section="section-header-search">
	<div class="ast-search-menu-icon slide-search">
		<form role="search" method="get" class="search-form" action="#URL_PAGE{recherche}">
			[(#URL_PAGE{recherche}|form_hidden)]
			<label for="search-field-#ENV{appareil}">
				<span class="screen-reader-text"><:astra:rechercher_libelle:></span>
				<input type="search" id="search-field-#ENV{appareil}" class="search-field" placeholder="<:astra:rechercher_placeholder|attribut_html:>" value="" name="recherche" tabindex="-1" />
				<button class="search-submit ast-search-submit" aria-label="<:astra:rechercher|attribut_html:>">
					<span hidden><:astra:rechercher:></span>
					<i><span class="ast-icon icon-search"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" x="0px" y="0px" viewBox="-893 477 142 142" enable-background="new -888 480 142 142" xml:space="preserve"><path d="M-787.4,568.7h-6.3l-2.4-2.4c7.9-8.7,12.6-20.5,12.6-33.1c0-28.4-22.9-51.3-51.3-51.3  c-28.4,0-51.3,22.9-51.3,51.3c0,28.4,22.9,51.3,51.3,51.3c12.6,0,24.4-4.7,33.1-12.6l2.4,2.4v6.3l39.4,39.4l11.8-11.8L-787.4,568.7  L-787.4,568.7z M-834.7,568.7c-19.7,0-35.5-15.8-35.5-35.5c0-19.7,15.8-35.5,35.5-35.5c19.7,0,35.5,15.8,35.5,35.5  C-799.3,553-815,568.7-834.7,568.7L-834.7,568.7z" /></svg></span></i>
				</button>
			</label>
		</form>
		<div class="ast-search-icon">
			<a class="slide-search astra-search-icon" role="button" tabindex="0" aria-label="<:astra:rechercher|attribut_html:>" href="#">
				<span class="screen-reader-text"><:astra:rechercher:></span>
				<span class="ast-icon icon-search"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" x="0px" y="0px" viewBox="-893 477 142 142" enable-background="new -888 480 142 142" xml:space="preserve"><path d="M-787.4,568.7h-6.3l-2.4-2.4c7.9-8.7,12.6-20.5,12.6-33.1c0-28.4-22.9-51.3-51.3-51.3  c-28.4,0-51.3,22.9-51.3,51.3c0,28.4,22.9,51.3,51.3,51.3c12.6,0,24.4-4.7,33.1-12.6l2.4,2.4v6.3l39.4,39.4l11.8-11.8L-787.4,568.7  L-787.4,568.7z M-834.7,568.7c-19.7,0-35.5-15.8-35.5-35.5c0-19.7,15.8-35.5,35.5-35.5c19.7,0,35.5,15.8,35.5,35.5  C-799.3,553-815,568.7-834.7,568.7L-834.7,568.7z" /></svg></span>
			</a>
		</div>
	</div>
</div>
